<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Board Games on Arduino — Tic-Tac-Toe and Checkers built on an Arduino Mega</title>
<desc>Illustration of an Arduino Mega wired to an LED matrix, LCD, keypad, and breadboard, with the title Tic-Tac-Toe and Checkers, Wired by Hand.</desc>
<defs>
