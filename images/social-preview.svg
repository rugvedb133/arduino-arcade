    <stop offset="0%" stop-color="#c9814a" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#c9814a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="85%" cy="80%" r="55%">
    <stop offset="0%" stop-color="#5b9dff" stop-opacity="0.12"/>
