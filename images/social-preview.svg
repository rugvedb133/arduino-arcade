<text x="128" y="154" font-family="Liberation Mono, monospace" font-size="19" letter-spacing="2" fill="#c9814a">CS122A &#183; EMBEDDED SYSTEMS</text>

<text x="88" y="270" font-family="Liberation Mono, monospace" font-weight="bold" font-size="72" fill="#e9efe9">TIC-TAC-TOE</text>
<text x="88" y="358" font-family="Liberation Mono, monospace" font-weight="bold" font-size="72" fill="#e9efe9">&amp; CHECKERS</text>

<text x="90" y="410" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#8fa197">Built from scratch on an Arduino Mega —</text>
<text x="90" y="440" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#8fa197">no game engine, no shortcuts.</text>

