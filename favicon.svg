<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Board Games on Arduino favicon</title>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0b100d"/>

  <!-- 3x3 LED grid, diagonal lit like the tic-tac-toe win state -->
  <rect x="7"  y="7"  width="14" height="14" rx="3" fill="#ff5c5c"/>
  <rect x="25" y="7"  width="14" height="14" rx="3" fill="#1b2620"/>
  <rect x="43" y="7"  width="14" height="14" rx="3" fill="#1b2620"/>

  <rect x="7"  y="25" width="14" height="14" rx="3" fill="#1b2620"/>
  <rect x="25" y="25" width="14" height="14" rx="3" fill="#ff5c5c"/>
  <rect x="43" y="25" width="14" height="14" rx="3" fill="#1b2620"/>

  <rect x="7"  y="43" width="14" height="14" rx="3" fill="#1b2620"/>
  <rect x="25" y="43" width="14" height="14" rx="3" fill="#1b2620"/>
  <rect x="43" y="43" width="14" height="14" rx="3" fill="#ff5c5c"/>
</svg>
