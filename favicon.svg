<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-2 -2 68 68">
  <title>Board Games on Arduino favicon</title>
  <defs>
    <radialGradient id="shadowGradient" cx="50%" cy="50%" r="60%">
      <stop offset="70%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="72" height="72" x="-4" y="-4" fill="url(#shadowGradient)" rx="14"/>
  <rect width="64" height="64" fill="#0b100d" rx="14"/>
<!--3x3 LED grid, diagonal lit like the tic-tac-toe win state-->
  <rect width="14" height="14" x="7" y="7" fill="#ff5c5c" rx="3"/>
  <rect width="14" height="14" x="25" y="7" fill="#1b2620" rx="3"/>
  <rect width="14" height="14" x="43" y="7" fill="#1b2620" rx="3"/>
  <rect width="14" height="14" x="7" y="25" fill="#5b9dff" rx="3"/>
  <rect width="14" height="14" x="25" y="25" fill="#ff5c5c" rx="3"/>
  <rect width="14" height="14" x="43" y="25" fill="#1b2620" rx="3"/>
  <rect width="14" height="14" x="7" y="43" fill="#5b9dff" rx="3"/>
  <rect width="14" height="14" x="25" y="43" fill="#1b2620" rx="3"/>
  <rect width="14" height="14" x="43" y="43" fill="#ff5c5c" rx="3"/>
</svg>